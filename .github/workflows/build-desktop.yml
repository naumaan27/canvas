name: Build Canvas Desktop Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/app/**'
      - 'packages/core/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-desktop.yml'

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist:win --workspace=quickdraw-app
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Canvas-Windows-Installer
          path: apps/app/release/*.exe
          if-no-files-found: error
          retention-days: 14
